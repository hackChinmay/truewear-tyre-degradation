[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truewear"
version = "0.1.0"
description = "AI/ML decision-support system for Formula 1 tyre degradation intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastf1>=3.3.0",
    "pandas>=2.1.0",
    "numpy>=1.25.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",
    "firebase-admin>=6.3.0",
    "joblib>=1.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
